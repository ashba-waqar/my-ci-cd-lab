name: CI/CD Pipeline - Lab 12

on:
  push:
    branches: [ main, master ]

jobs:
  # 1. Build and Test Stage (CI)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Tests / Linter
        run: echo "Running unit tests and code checks..."

  # 2. Security Scanning Stage (Step 3)
  security-scan:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # 3. Deploy to Development Environment (Step 4)
  deploy-to-dev:
    needs: security-scan
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Deploy to Dev
        run: echo "Deploying code to Development environment automatically."

  # 4. Deploy to Staging Environment (Step 4)
  deploy-to-staging:
    needs: deploy-to-dev
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to Staging
        run: echo "Deploying to Staging after passing checks."

  # 5. Deploy to Production with Manual Approval (Step 4)
  deploy-to-production:
    needs: deploy-to-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Production
        run: echo "Deploying to Production after manual review approval."
  # 6. Publish Build Artifacts (Step 5)
  publish-artifact:
    needs: deploy-to-production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: web-app-files
          path: |
            index.html
            style.css
            index.js      